[platformio]
src_dir = .

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<boat_switching.cpp>
extra_scripts = pre:scripts/esp_idf_includes.py
lib_deps =
    https://github.com/ttlappalainen/NMEA2000.git
    https://github.com/knifter/NMEA2000_TWAI.git#ec491b96ba3d5f76ace53a69a7c92d74e967320b